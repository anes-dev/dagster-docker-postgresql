services:
  dagster-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - 3000:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
  dagster-daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: "dagster-daemon run"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  dagster-postgres:
    image: postgres:17
    env_file:
      - .env
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - dagster-postgres:/var/lib/postgresql/data
volumes:
  dagster-postgres:
    driver: local
